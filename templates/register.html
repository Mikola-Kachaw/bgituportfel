<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/reg.css">
    <link rel="stylesheet" href="static/css/responsive.css">
    <title>Регистрация нового пользователя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="57x57" href="/static/assets/favicons/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/static/assets/favicons/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/static/assets/favicons/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/static/assets/favicons/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/static/assets/favicons/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/assets/favicons/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/static/assets/favicons/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/assets/favicons/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/favicons/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/static/assets/favicons/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/static/assets/favicons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicons/favicon-16x16.png">
    <link rel="manifest" href="/static/assets/favicons/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/static/assets/favicons/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <div class="banner">
        <img src="/static/assets/bgitu-portfel.png" alt="" class="logo">
        <h1>БГИТУ Портфель</h1>
        <p>Всё необходимое собрано<br>в одном месте.</p>
    </div>
    <div class="reg">
        <h1>Регистрация нового пользователя</h1>
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form action="{{ url_for('register_page') }}" method="POST" enctype="multipart/form-data">
            <div class="form-columns">
                <div class="left-column">
                    <label>Фамилия</label>
                    <input type="text" name="last_name" required>
                    <label>Имя</label>
                    <input type="text" name="first_name" required>
                    <label>Отчество</label>
                    <input type="text" name="patronymic" required>
                    <label>Логин</label>
                    <input type="text" name="login" required>
                    <label>Электронная почта</label>
                    <input type="email" name="email" required>
                    <label>Пароль</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" aria-label="Переключить видимость пароля">
                            <img src="/static/assets/eye-svgrepo-com.svg" class="eye-icon" alt="Показать пароль">
                            <img src="/static/assets/eye-closed-svgrepo-com.svg" class="eye-closed-icon" alt="Скрыть пароль" style="display: none;">
                        </button>
                    </div>
                    <p class="hint">Должен содержать не менее 8 символов.</p>
                </div>

                <div class="right-column">
                    <label>Степень обучения</label>
                    <div class="select-wrapper">
                        <select name="education_level" required>
                            <option value="" disabled selected>Выберите степень</option>
                            <option value="bachelor">Бакалавриат</option>
                            <option value="master">Магистратура</option>
                            <option value="postgraduate">Аспирантура</option>
                        </select>
                        <img src="/static/assets/alt-arrow-down-svgrepo-com.svg" class="select-arrow" alt="Раскрыть список">
                    </div>
                    <label>Институт</label>
                    <div class="select-wrapper">
                        <select name="education_level">
                            <option value="" disabled>Выберите институт</option>
                            <option value="iei">Инженерно-экономический институт</option>
                            <option value="si">Строительный институт</option>
                            <option value="ilklatie">Институт лесного комплекса, ландшафтной архитектуры, транспорта и экологии</option>
                        </select>
                        <img src="static/assets/alt-arrow-down-svgrepo-com.svg" class="select-arrow" alt="Раскрыть список">
                    </div>
                    <label>Курс</label>
                    <input type="number" name="course_number" value="" min="1" max="5" required>
                    <label>Группа</label>
                    <input type="text" name="group_name" value="" required>

                    <label>Пол</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="male" required> Мужской
                        </label>
                        <label>
                            <input type="radio" name="gender" value="female" required> Женский
                        </label>
                    </div>
                    <button type="submit" class="reg-btn">Зарегистрироваться</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
